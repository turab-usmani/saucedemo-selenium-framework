[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: Quick sanity/smoke tests covering core critical flows
    regression: Complete regression test suite
    login: Authentication and login related tests
    inventory: Catalog and product sorting tests
    cart: Shopping cart management tests
    checkout: End-to-end checkout and order placement tests
